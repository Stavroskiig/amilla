# Import local secrets (this file should be added to .gitignore)
spring.config.import=optional:classpath:application-secrets.properties

# Database Configuration
# Connects to default 'postgres' database which is guaranteed to exist on PostgreSQL installation.
# You can change 'postgres' to 'amilla' once you create it.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Amilla Application Custom Configuration
# JWT Token Signing Secret (Must be at least 256 bits, base64 encoded or a long secure string)
amilla.jwt.secret=${AMILLA_JWT_SECRET}
# JWT Expiration (e.g., 7 days in milliseconds = 604800000)
amilla.jwt.expiration-ms=${AMILLA_JWT_EXPIRATION_MS}

# Registration Group Code
amilla.registration.group-code=${REGISTRATION_GROUP_CODE}

# Web Push Notification Config
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:admin@amilla.com

# SHARP API ODDS
sharpapi.key=${SHARP_API_KEY}