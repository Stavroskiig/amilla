# Database Configuration
# Connects to default 'postgres' database which is guaranteed to exist on PostgreSQL installation.
# You can change 'postgres' to 'amilla' once you create it.
spring.datasource.url=jdbc:postgresql://localhost:5432/amilla
spring.datasource.username=postgres
spring.datasource.password=stavros
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Amilla Application Custom Configuration
# JWT Token Signing Secret (Must be at least 256 bits, base64 encoded or a long secure string)
amilla.jwt.secret=94a20b6f9f30b91e92d8f95c47a9e6dcf982a0b12cd89467de18ffcd84f67eef
# JWT Expiration (e.g., 7 days in milliseconds = 604800000)
amilla.jwt.expiration-ms=604800000

# Football API Configuration
amilla.football-api.api-url=https://api.football-data.org/v4
amilla.football-api.api-token=YOUR_FOOTBALL_DATA_API_TOKEN

# Viber API Configuration
# By default, mock mode is enabled. Set to false and provide a valid token to use the live API.
amilla.viber.mock=true
amilla.viber.api-url=https://chatapi.viber.com/pa
amilla.viber.auth-token=YOUR_VIBER_BOT_AUTH_TOKEN
amilla.viber.receiver-id=YOUR_VIBER_GROUP_OR_USER_RECEIVER_ID
