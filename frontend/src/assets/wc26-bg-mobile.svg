<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="none">
  <defs>
    <style>
      .st0 { fill: #6b0cee; } /* Purple */
      .st1 { fill: #eeff5b; } /* Yellow */
      .st2 { fill: #62fad8; } /* Mint */
      .st3 { fill: #3a4df9; } /* Blue */
      .st4 { fill: #f04020; } /* Red */
      .st5 { fill: #f59e7e; } /* Peach */
      .st6 { fill: #49c45b; } /* Green */
    </style>
  </defs>

  <!-- Top Right Blob (Red & Yellow) -->
  <!-- Keeps the top-left area completely free for text -->
  <path class="st4" d="M400,0 v200 c-40,-20 -70,-80 -100,-200 h100 z" />
  <path class="st1" d="M400,0 v130 c-30,-10 -50,-40 -60,-130 h60 z" />

  <!-- Mid Right Blob (Mint) -->
  <path class="st2" d="M400,400 c-60,30 -80,120 0,180 v-180 z" />

  <!-- Bottom Left Blob (Blue & Peach) -->
  <!-- Pushed further down to stay clear of content -->
  <path class="st3" d="M0,600 c80,40 120,120 100,200 h-100 v-200 z" />
  <path class="st5" d="M0,660 c50,30 70,80 60,140 h-60 v-140 z" />

  <!-- Bottom Right Blob (Purple & Green) -->
  <path class="st0" d="M200,800 c30,-80 100,-100 200,-60 v60 h-200 z" />
  <path class="st6" d="M280,800 c20,-40 60,-50 120,-30 v30 h-120 z" />
</svg>
