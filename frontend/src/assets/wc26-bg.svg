<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <style>
      .st0 { fill: #6b0cee; } /* Purple */
      .st1 { fill: #eeff5b; } /* Yellow */
      .st2 { fill: #62fad8; } /* Mint */
      .st3 { fill: #3a4df9; } /* Blue */
      .st4 { fill: #f04020; } /* Red */
      .st5 { fill: #f59e7e; } /* Peach */
      .st6 { fill: #49c45b; } /* Green */
    </style>
  </defs>

  <!-- Top Right Blob (Red & Yellow) -->
  <!-- Keeps the top-left area completely free for text -->
  <path class="st4" d="M1920,0 v400 c-80,-40 -140,-160 -200,-400 h200 z" />
  <path class="st1" d="M1920,0 v260 c-60,-20 -100,-80 -120,-260 h120 z" />

  <!-- Mid Right Blob (Mint) -->
  <path class="st2" d="M1920,540 c-120,60 -160,240 0,360 v-360 z" />

  <!-- Bottom Left Blob (Blue & Peach) -->
  <!-- Pushed further down to stay clear of content -->
  <path class="st3" d="M0,680 c160,80 240,240 200,400 h-200 v-400 z" />
  <path class="st5" d="M0,800 c100,60 140,160 120,280 h-120 v-280 z" />

  <!-- Bottom Right Blob (Purple & Green) -->
  <path class="st0" d="M1520,1080 c60,-160 200,-200 400,-120 v120 h-400 z" />
  <path class="st6" d="M1680,1080 c40,-80 120,-100 240,-60 v60 h-240 z" />
</svg>